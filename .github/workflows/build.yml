name: Build HARMONY VOICE

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Télécharger le projet
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Construire l'application
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Inspecter les signatures SoundTouch
        run: |
          gradle :app:dependencies --configuration debugCompileClasspath

          for aar in $(find ~/.gradle/caches/modules-2/files-2.1/com.tianscar.soundtouch -name "*.aar"); do
            echo "===== SOUND TOUCH AAR ====="
            echo "$aar"

            unzip -p "$aar" jni/arm64-v8a/libsoundtouchjni.so > /tmp/libsoundtouchjni.so

            echo "===== JNI SYMBOLS ====="
            nm -D /tmp/libsoundtouchjni.so | grep -E "Java_com_tianscar_soundtouch_SoundTouch|Java_com_tianscar_soundtouch_BPMDetector" || true

            echo "===== AAR CONTENT ====="
            unzip -l "$aar"
          done

      - name: Compiler HARMONY VOICE
        run: gradle assembleDebug

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: HARMONY-VOICE-APK
          path: app/build/outputs/apk/debug/app-debug.apk
