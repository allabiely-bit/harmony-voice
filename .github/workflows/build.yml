name: Build HARMONY VOICE

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Télécharger le projet
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Construire l'application
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Inspecter les signatures SoundTouch
        run: |
          gradle :app:dependencies --configuration debugCompileClasspath

          for aar in $(find ~/.gradle/caches/modules-2/files-2.1/com.tianscar.soundtouch -name "*.aar"); do
            echo "===== SOUND TOUCH AAR ====="
            echo "$aar"

            unzip -p "$aar" jni/arm64-v8a/libsoundtouchjni.so > /tmp/libsoundtouchjni.so

            echo "===== JNI SYMBOLS ====="
            nm -D /tmp/libsoundtouchjni.so | grep -E "Java_com_tianscar_soundtouch_SoundTouch|Java_com_tianscar_soundtouch_BPMDetector" || true

            echo "===== JNI STRINGS ====="
            strings /tmp/libsoundtouchjni.so | grep -E "SoundTouch|BPMDetector|setPitch|setTempo|putSamples|receiveSamples|createInstance" || true

            echo "===== AAR CONTENT ====="
            unzip -l "$aar"
          done
      - name: Inspecter classes.jar SoundTouch
        run: |
          echo "===== EXTRACTION CLASSES.JAR ====="

          mkdir -p /tmp/soundtouch

          for aar in $(find ~/.gradle/caches/modules-2/files-2.1/com.tianscar.soundtouch \
            -type f -name "*.aar"); do

            echo "AAR : $aar"

            unzip -p "$aar" classes.jar > /tmp/soundtouch/classes.jar

            echo "===== CLASSES.JAR ====="
            ls -lh /tmp/soundtouch/classes.jar

            echo "===== CONTENU CLASSES.JAR ====="

            unzip -l /tmp/soundtouch/classes.jar \
              | grep -E "com/tianscar/soundtouch/.*\\.class" \
              || true
           done
      - name: Inspecter SoundTouch CORE
        run: |
          echo "===== SOUND TOUCH CORE JAR ====="

          find ~/.gradle/caches/modules-2/files-2.1/com.tianscar.soundtouch \
            -type f -name "soundtouch-jni-core-1.1.1.jar" \
            -print

          for jar in $(find ~/.gradle/caches/modules-2/files-2.1/com.tianscar.soundtouch \
            -type f -name "soundtouch-jni-core-1.1.1.jar"); do

            echo "===== JAR ====="
            echo "$jar"

            echo "===== CONTENU CORE ====="

            unzip -l "$jar" \
              | grep -E "com/tianscar/soundtouch/.*\\.class" \
              || true

          done
      - name: Inspecter les méthodes SoundTouch
        run: |
          echo "===== MÉTHODES SOUND TOUCH ====="

          JAR=$(find ~/.gradle/caches/modules-2/files-2.1/com.tianscar.soundtouch \
            -type f -name "soundtouch-jni-core-1.1.1.jar" \
            | head -n 1)

          javap -classpath "$JAR" -public \
            com.tianscar.soundtouch.SoundTouch
      - name: Vérifier la configuration audio
        run: |
          echo "===== CONFIGURATION AUDIO HARMONY VOICE ====="

          echo "Source audio : MICROPHONE"
          echo "Format : THREE_GPP"
          echo "Codec : AMR_NB"

          echo "===== COMPATIBILITÉ SOUNDTOUCH ====="

          JAR=$(find ~/.gradle/caches/modules-2/files-2.1/com.tianscar.soundtouch \
            -type f -name "soundtouch-jni-core-1.1.1.jar" \
            | head -n 1)

          javap -classpath "$JAR" -public \
            com.tianscar.soundtouch.SoundTouch \
            | grep -E "setSampleRate|setChannels|putSamples|receiveSamplesI16"
      - name: Compiler HARMONY VOICE
        run: gradle assembleDebug

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: HARMONY-VOICE-APK
          path: app/build/outputs/apk/debug/app-debug.apk
