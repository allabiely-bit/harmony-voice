name: Build HARMONY VOICE

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Télécharger le projet
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Construire l'application
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Inspecter SoundTouch
        run: |
          gradle :app:dependencies --configuration debugCompileClasspath
          find ~/.gradle/caches/modules-2/files-2.1/com.tianscar.soundtouch -type f | sort

      - name: Compiler HARMONY VOICE
        run: gradle assembleDebug
  
        
      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: HARMONY-VOICE-APK
          path: app/build/outputs/apk/debug/app-debug.apk
