name: Build HARMONY VOICE

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Télécharger le projet
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Construire l'application
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Inspecter les signatures SoundTouch
        run: |
          ...
      
      - name: Inspecter le JAR Java SoundTouch
        run: |
          mkdir -p /tmp/soundtouch

          curl -L \
            -o /tmp/soundtouch/soundtouch-jni-javase-1.1.1.jar \
            https://repo1.maven.org/maven2/com/tianscar/soundtouch-jni-javase/1.1.1/soundtouch-jni-javase-1.1.1.jar

          echo "===== SOUND TOUCH JAVASE JAR ====="
          ls -lh /tmp/soundtouch/soundtouch-jni-javase-1.1.1.jar

          echo "===== SOUND TOUCH JAVA CLASSES ====="
          unzip -l /tmp/soundtouch/soundtouch-jni-javase-1.1.1.jar \
            | grep -E "SoundTouch|BPMDetector|\\.class"

      - name: Compiler HARMONY VOICE
        run: gradle assembleDebug

      - name: Compiler HARMONY VOICE
        run: gradle assembleDebug

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: HARMONY-VOICE-APK
          path: app/build/outputs/apk/debug/app-debug.apk
